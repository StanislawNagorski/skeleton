name: skeleton
description: "Skeleton project to copy for new projects."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.0

dependencies:
  auto_route: ^11.1.0
  cloud_firestore: ^6.3.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  firebase_analytics: ^12.3.0
  firebase_app_check: ^0.4.3
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_performance: ^0.11.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.3.9
  flutter_secure_storage: ^10.0.0
  get_it: ^8.0.3
  google_sign_in: ^7.2.0
  injectable: ^2.5.0
  intl: ^0.20.2
  logger: ^2.5.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  auto_route_generator: ^10.5.0
  bloc_test: ^10.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.32.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.6.2
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/images/webp/
